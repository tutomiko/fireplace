[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fireplace"
version = "0.1.0"
description = "Induces, enriches, and dissipates spatial heatmaps based on embedding similarities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
harness = [
    "fastapi",
    "uvicorn",
    "torch",
    "transformers",
    "pillow",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
